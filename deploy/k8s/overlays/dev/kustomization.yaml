apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gomicro-dev
namePrefix: dev-

resources:
  - ../../base

# ONE overlay ships, not three.
#
# base + dev/staging/prod is the reflex, and staging/prod would be empty scaffolding here: a
# template cannot know your namespaces, your registry, your secret manager or your ingress.
# Copying dev/ is a two-minute job that produces something true; shipping two directories of
# guesses produces something that looks authoritative and is not.

images:
  - name: gomicro/orderd
    newTag: dev

replicas:
  - name: orderd
    count: 1

patches:
  # Dev runs a single replica, so a PDB requiring one available blocks every node drain --
  # kubectl drain waits forever for a budget that can never be satisfied. Removing it is
  # correct here and wrong in production, which is exactly the kind of thing an overlay is for.
  - target:
      kind: PodDisruptionBudget
      name: orderd
    patch: |
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: orderd

  # Same reasoning for the HPA: it would immediately scale past the single replica above.
  - target:
      kind: HorizontalPodAutoscaler
      name: orderd
    patch: |
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: orderd

  # A STRATEGIC MERGE PATCH, addressing env entries BY NAME.
  #
  # This was a JSON patch addressing them by index, and the index was wrong: env/5 is
  # STORE_DRIVER, not AUTH_MODE. So the overlay set STORE_DRIVER=dev -- a value
  # config.Validate refuses, since the only valid drivers are memory and postgres -- and left
  # AUTH_MODE=oidc. Every orderd pod in the dev overlay failed validation and CrashLoopBackOffed
  # before opening a listener, while the comment below claimed the opposite was happening.
  #
  # An index into a list is a reference that silently retargets whenever the list is reordered,
  # and nothing type-checks it: `kubectl kustomize` renders the wrong patch perfectly happily.
  # Merging by name cannot retarget, which removes the whole class rather than this instance.
  # env-var ordering in the base is load-bearing for a different reason too -- see the POD_IP
  # note in deployment.yaml.
  - target:
      kind: Deployment
      name: orderd
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: orderd
      spec:
        template:
          spec:
            containers:
              - name: orderd
                env:
                  - name: APP_ENV
                    value: development
                  # APP_ENV=development means config.Validate permits AUTH_MODE=dev, so a local
                  # cluster needs no identity provider. The base sets production + oidc; this is
                  # the deliberate, visible relaxation rather than a default that quietly differs.
                  - name: AUTH_MODE
                    value: dev
