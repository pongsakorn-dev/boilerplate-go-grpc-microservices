apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  # ONE REPLICA BY DEFAULT, and that is a considered number rather than a placeholder.
  #
  # The relay is safe to run many times over -- FOR UPDATE SKIP LOCKED is exactly what makes
  # concurrent claims disjoint -- so this is not a correctness limit. It is an ordering one:
  # with two relays, two events for the same order can be split across batches and reach the
  # broker out of order. See the guarantees at the top of internal/platform/outbox.
  #
  # Scale it up when throughput matters more than per-aggregate order, which for most services
  # is immediately. The consumer side scales independently and safely either way, because
  # processed_events makes duplicate delivery a no-op.
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: worker

  strategy:
    # RECREATE, not RollingUpdate.
    #
    # A rolling update would briefly run the old and new worker together, which is harmless
    # for correctness and pointless here: there is no traffic to keep serving, so the only
    # thing overlap buys is a second relay competing for the same rows during every deploy.
    type: Recreate

  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      # Shorter than orderd's 40s, because the worker has nothing to drain.
      #
      # It serves no traffic, so there is no endpoint-removal delay to wait out. On SIGTERM
      # the relay's in-flight transaction rolls back and its rows stay unpublished for the
      # next process; the consumer drains its buffered messages within AckWait, and anything
      # it does not finish is redelivered. Both are designed to be interrupted.
      terminationGracePeriodSeconds: 40

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: worker
          image: gomicro/worker
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]

          ports:
            # The admin listener carries /metrics and pprof. It is NOT a probe surface --
            # see below.
            - name: admin
              containerPort: 9090

          # STILL NO PROBES, and now for a sharper reason than before.
          #
          # This container used to open no listener at all, and the argument was that an HTTP
          # server added to answer a liveness check only reports that the HTTP server is
          # alive -- not the question, since a relay wedged on a broker that accepts
          # connections and never acks would pass such a probe forever.
          #
          # There is a listener now, and that argument is unchanged: a /healthz here would
          # still answer the wrong question, so nothing probes it. What the listener carries
          # is the signal that DOES detect a wedged relay, which this file previously named
          # and then left in the database where nothing could reach it:
          #
          #   gomicro_outbox_oldest_pending_age_seconds   climbs when nothing is draining
          #   gomicro_outbox_quarantined_rows             events nobody is coming back for
          #
          # Alert on those. The first cannot be satisfied by a process that is merely running,
          # which is exactly what makes it better than a probe. Alert on staleness of
          # gomicro_outbox_last_observation_timestamp_seconds too -- if the observer itself
          # dies, every gauge above freezes at a value that looks healthy.
          #
          # A fork that genuinely wants Kubernetes to RESTART a wedged worker still needs a
          # /healthz reflecting drain progress rather than process liveness; the listener is
          # now here to hang it on.

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # Memory only. A CPU limit causes CFS throttling, which on a batch worker turns
              # a backlog into a much longer backlog for no benefit. Same reasoning as orderd.
              memory: 256Mi

          env:
            - name: APP_ENV
              value: production
            - name: SERVICE_NAME
              value: worker
            # The relay's pool is small on purpose: background work must not compete with
            # request-serving replicas for the database's connection budget.
            - name: OUTBOX_MAX_CONNS
              value: "2"
            - name: OUTBOX_POLL_INTERVAL
              value: "1s"
            # How often the outbox gauges are refreshed. On its own clock, NOT the relay's:
            # a wedged relay must not be able to stop the metric that reports it.
            - name: OUTBOX_OBSERVE_INTERVAL
              value: "15s"

            # POD_IP FIRST. The kubelet resolves $(VAR) only against variables declared
            # EARLIER in this list; a forward reference is left literal, so ADMIN_ADDR would
            # arrive as the string "$(POD_IP):9090" and the listener would never bind --
            # taking the outbox gauges above with it. See deployment.yaml for the full note.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Bound to the POD IP, not 0.0.0.0 and not localhost. A scraper inside the
            # cluster must reach /metrics; nothing outside it should. Binding to loopback --
            # the default, which is right for a laptop -- would make this pod unscrapable and
            # the metrics above pointless.
            - name: ADMIN_ADDR
              value: "$(POD_IP):9090"

          envFrom:
            # Carries POSTGRES_DSN and NATS_URL. With NATS_URL absent the worker still runs
            # and logs what it would publish -- see outbox.LogPublisher -- so a missing secret
            # degrades to visible no-op rather than a crash loop.
            - secretRef:
                name: orderd-secrets

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
