apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - worker.yaml
  - service.yaml
  - pdb.yaml
  - hpa.yaml

# labels, not the deprecated commonLabels. kustomize v5 warns on the old field, and a build
# that prints a warning every time trains people to ignore its output.
#
# includeSelectors: false is important -- adding a label to a Deployment SELECTOR is an
# immutable-field change, so an existing Deployment cannot be updated in place and the apply
# fails with a message that does not mention labels at all.
labels:
  - pairs:
      app.kubernetes.io/part-of: gomicro
    includeSelectors: false
