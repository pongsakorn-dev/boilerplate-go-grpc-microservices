# The local development stack.
#
#   docker compose up -d                     postgres + redis + nats. That is all most work needs.
#   docker compose --profile auth up -d      adds Keycloak, for the OIDC path
#   docker compose --profile obs  up -d      adds Grafana/Tempo/Prometheus in one container
#   docker compose --profile app  up -d      adds orderd and the worker, built from source
#
# PROFILES, so the default `up` is two containers and a few seconds. A compose file that
# starts eight services by default is a compose file people stop using: the JVM alone costs
# more startup than the whole rest of the stack, and most changes never touch auth.
#
# The APPLICATION is deliberately not in the default set either. Running it on the host with
# `go run ./cmd/orderd` against these containers is faster to iterate on -- no image rebuild
# per edit -- and hot reload actually works, which it does not across a Windows bind mount
# because inotify events do not cross it.

name: gomicro

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gomicro
      POSTGRES_PASSWORD: gomicro
      POSTGRES_DB: gomicro
      # Speeds up initdb noticeably and is safe for a throwaway database.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone reports true during the entrypoint's FIRST start, before the
      # server restarts for real -- so anything depending on it races. Naming the user and
      # database makes it a genuine connectivity check.
      test: ["CMD-SHELL", "pg_isready -U gomicro -d gomicro"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  redis:
    image: redis:7-alpine
    # No persistence: this holds rate-limit buckets, which are worthless after a restart and
    # regenerate in seconds. Persisting them would only add disk I/O and a file to clean up.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  nats:
    image: nats:2-alpine
    # -js enables JetStream, which is what makes streams, consumers and Nats-Msg-Id
    # deduplication exist at all. Plain NATS core is fire-and-forget: a publish with no
    # subscriber is silently discarded, which is precisely the delivery guarantee an outbox
    # exists to avoid.
    #
    # -sd is the store directory. It is a named volume rather than a bind mount so the stream
    # survives `docker compose restart` but not `down -v`, matching how postgres-data behaves.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"   # clients -- the value for NATS_URL
      - "8222:8222"   # monitoring: http://localhost:8222/jsz?streams=1
    volumes:
      - nats-data:/data
    healthcheck:
      # /healthz on the monitoring port. The image has no curl, but it does have wget.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15

  keycloak:
    profiles: ["auth"]
    image: quay.io/keycloak/keycloak:26.4
    # start-dev, never `start`. Development mode skips the hostname and TLS configuration a
    # production Keycloak demands, which is exactly the ceremony that stops people trying the
    # OIDC path at all. It is also why this file says nowhere that it is production-ready.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      # Read-only: the realm file is source, and a Keycloak that can rewrite it would turn a
      # committed, reviewable configuration into local state nobody can reproduce.
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # Keycloak 26 serves health on the MANAGEMENT port (9000), not 8080, and the image has
      # no curl or wget. This speaks HTTP by hand through a bash /dev/tcp redirect, which is
      # the documented workaround for distroless-ish Keycloak images.
      #
      # CRLF, NOT LF, and that is the whole reason this line works.
      #
      # It shipped using `echo -e` with bare \n separators and NEVER PASSED ONCE. HTTP/1.1
      # requires CRLF between header lines; Quarkus enforces it and answers 400 Bad Request,
      # so the grep never matched, the container sat unhealthy for its full 170-second retry
      # budget, and anything with `depends_on: condition: service_healthy` could not start.
      #
      # Nothing noticed because nothing depended on it: Keycloak sits behind `--profile auth`,
      # and the milestone that added it verified the realm by hand rather than by waiting on
      # this check. The OIDC e2e tier is the first thing to require it, and found it
      # immediately. printf rather than `echo -e` because printf's escape handling is
      # specified rather than shell-dependent.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  otel-lgtm:
    profiles: ["obs"]
    # Grafana + Tempo + Loki + Prometheus in ONE container, from the Grafana project.
    # Four separate services with their own configuration files is a lot of YAML to maintain
    # for something whose job is to be glanced at during development.
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC -- the value for OTEL_EXPORTER_OTLP_ENDPOINT
      - "4318:4318"   # OTLP HTTP
    environment:
      ENABLE_LOGS_ALL: "true"

  orderd:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: orderd
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      GRPC_ADDR: ":50051"
      GATEWAY_ADDR: ":8080"
      # 0.0.0.0 ONLY because a container's admin port is reachable only via the published
      # port list below, which deliberately omits it. On a host or a pod this stays bound to
      # localhost -- /debug/pprof on a routable interface is a heap dumper for anyone.
      ADMIN_ADDR: "0.0.0.0:9090"
      STORE_DRIVER: postgres
      POSTGRES_DSN: "postgres://gomicro:gomicro@postgres:5432/gomicro?sslmode=disable"
      REDIS_ADDR: "redis:6379"
    ports:
      - "50051:50051"
      - "8080:8080"
    healthcheck:
      # THE BINARY PROBES ITSELF. The image has no shell, no curl and deliberately no
      # grpc_health_probe, and Compose has no equivalent of Kubernetes' native grpc: probe --
      # so `orderd -health` dials its own gRPC health endpoint and exits 0 only if SERVING.
      #
      # This line used to read `/orderd --help`, a flag the binary never parsed: instead of
      # printing usage it started a SECOND server inside the container and raced the first for
      # the port, so the healthcheck could never pass. The e2e tier found it by running the
      # stack, which is the only thing that would have.
      test: ["CMD", "/orderd", "-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  migrate:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://gomicro:gomicro@postgres:5432/gomicro?sslmode=disable"
    command: ["up"]
    # Runs to completion and exits. orderd waits on service_completed_successfully, which is
    # the compose equivalent of the Kubernetes Job that must finish before the Deployment
    # rolls -- and the reason migrations are not run on server boot.
    restart: "no"

  worker:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://gomicro:gomicro@postgres:5432/gomicro?sslmode=disable"
      OUTBOX_POLL_INTERVAL: "2s"
      # Without NATS_URL the worker uses outbox.LogPublisher and prints what it would send.
      # That is a supported configuration -- but the compose stack has a broker, so use it.
      NATS_URL: "nats://nats:4222"
      # Faster than the 15s default so the outbox gauges are useful while poking at a local
      # stack. ADMIN_ADDR binds all interfaces because the default is loopback INSIDE the
      # container, which nothing on the host or on the compose network could ever reach.
      OUTBOX_OBSERVE_INTERVAL: "2s"
      ADMIN_ADDR: "0.0.0.0:9090"
    ports:
      # The worker's admin surface: /metrics carrying the outbox gauges, and pprof.
      #
      # 9091 on the host, leaving 9090 free for orderd's own admin listener -- which this file
      # deliberately does not publish, because pprof on a host port is a profile dump and a
      # free CPU-pinning DoS for anything that can reach it. The worker's is published only
      # because the outbox gauges are the point of this milestone and looking at them from the
      # host is how you check the stack. Delete this mapping for anything but local work.
      - "9091:9090"

volumes:
  postgres-data:
  nats-data:
